<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480"><style>.kf{animation:kf 4.2s ease-in-out infinite}@keyframes kf{50%{transform:translateY(-10px)}}.aura{animation:ka 2.6s ease-in-out infinite}@keyframes ka{0%,100%{opacity:.95}50%{opacity:.4}}.kr{transform-origin:600px 240px;animation:kr 3s ease-in-out infinite}@keyframes kr{50%{opacity:.8;transform:scale(1.012)}}@media (prefers-reduced-motion:reduce){.kf,.aura,.kr,.kp{animation:none;display:inline}}</style><defs><filter id="knaura" x="-40%" y="-40%" width="180%" height="180%">
  <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="d"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.014 0.035" numOctaves="3" seed="4" result="n"/>
  <feDisplacementMap in="d" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G" result="w"/>
  <feGaussianBlur in="w" stdDeviation="10" result="b"/>
  <feFlood flood-color="#f5c542"/><feComposite in2="b" operator="in" result="g1"/>
  <feGaussianBlur in="SourceAlpha" stdDeviation="34" result="b2"/>
  <feFlood flood-color="#1a2a8a" flood-opacity=".9"/><feComposite in2="b2" operator="in" result="g2"/>
  <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/></feMerge>
</filter>
<filter id="knglow" x="-50%" y="-50%" width="200%" height="200%">

  <feFlood flood-color="#6a4a10" flood-opacity=".9"/><feComposite in2="b2" operator="in" result="g2"/>
  <feMerge><feMergeNode in="g2"/><feMergeNode in="g1"/></feMerge>
</filter>
<filter id="piglow" x="-50%" y="-50%" width="200%" height="200%">

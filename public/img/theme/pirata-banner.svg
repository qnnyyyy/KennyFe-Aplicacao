<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480"><style>.kf{animation:kf 4.2s ease-in-out infinite}@keyframes kf{50%{transform:translateY(-10px)}}.aura{animation:ka 2.6s ease-in-out infinite}@keyframes ka{0%,100%{opacity:.95}50%{opacity:.4}}.kr{transform-origin:600px 240px;animation:kr 3s ease-in-out infinite}@keyframes kr{50%{opacity:.8;transform:scale(1.012)}}@media (prefers-reduced-motion:reduce){.kf,.aura,.kr,.kp{animation:none;display:inline}}</style><defs><filter id="piaura" x="-40%" y="-40%" width="180%" height="180%">

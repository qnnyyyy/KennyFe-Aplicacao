<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b14" />
  <meta name="description" content="Kenfeh — calls, compartilhamento de tela em alta qualidade, chat, figurinhas e GIFs." />
  <title>Kenfeh</title>
  <link rel="icon" type="image/svg+xml" href="/img/kenfeh-mark.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&family=Anton&family=Bangers&family=Pacifico&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/cosmetics.css" />
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- ===== Login / Cadastro ===== -->
  <section id="auth" class="auth hidden">
    <div class="auth-card glass">
      <div class="brand">
        <img class="brand-logo" src="/img/kenfeh-mark.svg" alt="" />
        <h1>Ken<span>feh</span></h1>
        <p>Calls em alta, telas sem limite e figurinhas com a galera.</p>
      </div>
      <div class="auth-tabs" role="tablist">
        <button class="active" data-tab="login" role="tab">Entrar</button>
        <button data-tab="register" role="tab">Criar conta</button>
        <span class="auth-tab-indicator"></span>
      </div>
      <form id="auth-form" autocomplete="on">
        <label class="field register-only">
          <span>Nome de exibição</span>
          <input class="input" name="displayName" maxlength="32" placeholder="Ex.: Kenny" autocomplete="nickname" />
        </label>
        <label class="field register-only">
          <span>E-mail</span>
          <input class="input" name="email" type="email" maxlength="120" placeholder="voce@email.com" autocomplete="email" autocapitalize="none" />
        </label>
        <label class="field register-only hidden" id="access-code-field">
          <span>Código de acesso</span>
          <input class="input" name="accessCode" maxlength="64" placeholder="Pedido pra quem administra o site" autocomplete="off" />
        </label>
        <label class="field">
          <span>Usuário</span>
          <input class="input" name="username" required minlength="3" maxlength="24" placeholder="seu_usuario" autocomplete="username" autocapitalize="none" />
        </label>
        <label class="field">
          <span>Senha</span>
          <input class="input" name="password" type="password" required minlength="6" placeholder="••••••" autocomplete="current-password" />
        </label>
        <p class="auth-error" id="auth-error"></p>
        <button class="btn btn-primary btn-lg" type="submit" id="auth-submit">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ===== Aplicativo ===== -->
  <section id="app" class="app hidden">
    <aside class="rail">
      <button class="rail-home" id="btn-home" title="Início — amigos e conversas"><img class="rail-brand" src="/img/kenfeh-mark.svg" alt="Kenfeh" /><span class="rail-badge hidden" id="home-badge"></span></button>
      <div class="rail-sep"></div>
      <nav id="group-rail" class="rail-groups"></nav>
      <button class="rail-btn rail-add" id="btn-new-group" title="Criar ou entrar em um grupo">+</button>
    </aside>

    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="sidebar-title" id="sidebar-title">Bem-vindo(a)</div>
        <button class="icon-btn" id="btn-group-menu" title="Opções do grupo"></button>
      </header>
      <div class="sidebar-body home-side hidden" id="home-side"></div>
      <div class="sidebar-body group-side" id="group-side">
        <div class="channel-list" id="channel-list"></div>
        <div class="members" id="members"></div>
      </div>
      <div class="voice-panel hidden" id="voice-panel">
        <div class="vp-status"><span class="vp-dot"></span><div><b>Na call</b><small id="vp-group"></small></div></div>
        <button class="icon-btn danger" id="vp-leave" title="Sair da call"></button>
      </div>
      <footer class="me-bar">
        <div class="me" id="me-card"></div>
        <div class="me-actions">
          <button class="icon-btn" id="me-mic" title="Mutar (Ctrl+Shift+M)"></button>
          <button class="icon-btn" id="me-deaf" title="Ensurdecer (Ctrl+Shift+D)"></button>
          <button class="icon-btn" id="me-settings" title="Configurações"></button>
        </div>
      </footer>
    </aside>

    <main class="main" id="main">
      <!-- Início (amigos, conversas, atividade) -->
      <div class="home" id="home"></div>

      <!-- Área do grupo: call (palco) + chat -->
      <div class="room hidden" id="room">
        <section class="stage-wrap hidden" id="stage-wrap">
          <div class="stage" id="stage"></div>
          <div class="stage-overlay-top">
            <div class="stage-title" id="stage-title"></div>
          </div>
          <div class="call-controls" id="call-controls"></div>
        </section>
        <div class="room-resizer hidden" id="room-resizer" title="Arraste para ajustar"></div>
        <section class="chat" id="chat">
          <header class="chat-head">
            <div class="chat-title"><span class="chat-icon" id="chat-icon"></span><b id="chat-name"></b><small class="chat-topic" id="chat-topic"></small></div>
            <div class="panel-tabs" id="panel-tabs">
              <button data-tab="chat" class="active">💬 <span>Chat</span></button>
              <button data-tab="games">🎮 <span>Jogos</span><i class="tab-dot hidden" id="games-dot"></i></button>
            </div>
            <div class="chat-head-actions">
              <button class="btn btn-call" id="btn-join-call"></button>
              <button class="icon-btn" id="btn-toggle-chat" title="Esconder chat"></button>
            </div>
          </header>
          <div class="games-view hidden" id="games-view"></div>
          <div class="messages" id="messages"></div>
          <div class="typing" id="typing"></div>
          <div class="composer-wrap">
            <div class="reply-bar hidden" id="reply-bar"></div>
            <div class="cmd-pop hidden" id="cmd-pop"></div>
            <div class="composer" id="composer">
              <button class="icon-btn" id="btn-attach" title="Enviar arquivo"></button>
              <textarea id="msg-input" rows="1" placeholder="Mensagem..." maxlength="4000"></textarea>
              <button class="icon-btn" id="btn-gif" title="Figurinhas e GIFs"></button>
              <button class="icon-btn" id="btn-emoji" title="Emojis"></button>
              <button class="icon-btn send" id="btn-send" title="Enviar"></button>
            </div>
            <input type="file" id="file-input" hidden multiple />
          </div>
        </section>
      </div>
    </main>
  </section>

  <div id="layer"></div>
  <div id="toasts"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
